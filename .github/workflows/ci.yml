name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Dml.Launcher.sln
      - run: dotnet format Dml.Launcher.sln --verify-no-changes --no-restore
      - run: dotnet build Dml.Launcher.sln --configuration Release --no-restore
      - run: dotnet test Dml.Launcher.sln --configuration Release --no-build --verbosity normal
